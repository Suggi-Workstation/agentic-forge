name: forge-contract

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: forge-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Forge contract
        run: python3 scripts/validate-forge.py --root .

      - name: Run Forge regression tests
        run: python3 -m unittest tests/test-forge-system.py -v
